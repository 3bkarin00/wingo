# Benchmark: large — 100 stations, 5 segments, sweep/dihedral, twist transition,
# TE surface + LE droop, two spars. Exercises the full geometry pipeline.
planform:
  span_mm: 2800
  segments:
    - {name: root_a, y_end_frac: 0.20, dihedral_deg: 1.0, sweep_le_deg: 0.0}
    - {name: root_b, y_end_frac: 0.40, dihedral_deg: 3.0, sweep_le_deg: 1.5}
    - {name: mid, y_end_frac: 0.60, dihedral_deg: 5.0, sweep_le_deg: 3.5}
    - {name: tip_a, y_end_frac: 0.80, dihedral_deg: 7.0, sweep_le_deg: 5.0}
    - {name: tip_b, y_end_frac: 1.00, dihedral_deg: 8.0, sweep_le_deg: 6.0}
  stations:
    - {y_frac: 0.00, chord_mm: 340, twist_deg: 3.0, airfoil: naca2412}
    - {y_frac: 0.01, chord_mm: 338, twist_deg: 2.95, airfoil: naca2412}
    - {y_frac: 0.02, chord_mm: 336, twist_deg: 2.90, airfoil: naca2412}
    - {y_frac: 0.03, chord_mm: 334, twist_deg: 2.85, airfoil: naca2412}
    - {y_frac: 0.04, chord_mm: 332, twist_deg: 2.80, airfoil: naca2412}
    - {y_frac: 0.05, chord_mm: 330, twist_deg: 2.75, airfoil: naca2412}
    - {y_frac: 0.06, chord_mm: 328, twist_deg: 2.70, airfoil: naca2412}
    - {y_frac: 0.07, chord_mm: 326, twist_deg: 2.65, airfoil: naca2412}
    - {y_frac: 0.08, chord_mm: 324, twist_deg: 2.60, airfoil: naca2412}
    - {y_frac: 0.09, chord_mm: 322, twist_deg: 2.55, airfoil: naca2412}
    - {y_frac: 0.10, chord_mm: 320, twist_deg: 2.50, airfoil: naca2412}
    - {y_frac: 0.11, chord_mm: 318, twist_deg: 2.45, airfoil: naca2412}
    - {y_frac: 0.12, chord_mm: 316, twist_deg: 2.40, airfoil: naca2412}
    - {y_frac: 0.13, chord_mm: 314, twist_deg: 2.35, airfoil: naca2412}
    - {y_frac: 0.14, chord_mm: 312, twist_deg: 2.30, airfoil: naca2412}
    - {y_frac: 0.15, chord_mm: 310, twist_deg: 2.25, airfoil: naca2412}
