    - {y_frac: 0.17, chord_mm: 306, twist_deg: 2.15, airfoil: naca2412}
    - {y_frac: 0.18, chord_mm: 304, twist_deg: 2.10, airfoil: naca2412}
    - {y_frac: 0.19, chord_mm: 302, twist_deg: 2.05, airfoil: naca2412}
    - {y_frac: 0.20, chord_mm: 300, twist_deg: 2.00, airfoil: naca2412}
    - {y_frac: 0.25, chord_mm: 285, twist_deg: 1.50, airfoil: naca2412}
    - {y_frac: 0.30, chord_mm: 270, twist_deg: 1.00, airfoil: naca2412}
    - {y_frac: 0.35, chord_mm: 258, twist_deg: 0.50, airfoil: naca2412}
    - {y_frac: 0.40, chord_mm: 246, twist_deg: 0.00, airfoil: naca2412}
    - {y_frac: 0.45, chord_mm: 236, twist_deg: -0.50, airfoil: naca2412}
