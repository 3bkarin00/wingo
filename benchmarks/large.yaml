  twist_axis_xc: 0.25
  mirror: true
airfoils: {sources: [naca4], resample_points: 199, te_min_thickness_mm: 0.8}
skin:
  face_sheet: {material: cfrp_200gsm_twill, plies: 1}
  core: {material: rohacell_31, thickness_mm: 2.5}
  ramp_ratio: 3.0
spars:
  - {name: main, xc_root: 0.25, xc_tip: 0.25, web: {material: cfrp_200gsm_twill, plies: 3},
     tongue: {cross_section: rect_hollow, engagement_mm: 140, clearance_mm: 0.2, wall_mm: 2.0}}
  - {name: rear, xc_root: 0.70, xc_tip: 0.70, web: {material: cfrp_200gsm_twill, plies: 2},
     tongue: {cross_section: rect_hollow, engagement_mm: 120, clearance_mm: 0.2, wall_mm: 2.0}}
ribs: {count: 15, construction: {material: cfrp_200gsm_twill, plies: 2}, lightening_holes: {enabled: true, margin_mm: 8}}
te_surface: {enabled: true, span_start_frac: 0.60, span_end_frac: 0.80,
             hinge_xc_start: 0.75, hinge_xc_end: 0.75, gap_mm: 1.5,
             max_deflection_deg: 25, hinges: {mode: generated, count: 4}}
le_droop:   {enabled: true, span_start_frac: 0.20, span_end_frac: 0.40,
             hinge_xc_start: 0.15, hinge_xc_end: 0.15, gap_mm: 1.5,
             max_deflection_deg: 20, hinges: {mode: generated, count: 3}}
output: {formats: [step, stl, gltf]}
