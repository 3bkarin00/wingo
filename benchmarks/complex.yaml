te_surface: {enabled: true, span_start_frac: 0.50, span_end_frac: 0.625,
             hinge_xc_start: 0.75, hinge_xc_end: 0.75, gap_mm: 1.5,
             max_deflection_deg: 25, hinges: {mode: generated, count: 5}}
